name: Synthesize bitstream

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  OSS_CAD_SUITE_VERSION: "2026-11-10"

jobs:
  formal:
    name: Formal verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4
    # setup-oss-cad-suite always queries the GitHub releases API and downloads
    # the suite, so restore it from the cache and only run the action on a miss.
    # The action extracts to $RUNNER_TEMP/oss-cad-suite and adds its bin/ to
    # PATH, which is all a cache hit needs to redo.
    - name: Restore OSS CAD Suite
      id: oss-cad-suite-cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/oss-cad-suite
        key: oss-cad-suite-${{ runner.os }}-${{ runner.arch }}-${{ env.OSS_CAD_SUITE_VERSION }}
    - name: Install OSS CAD Suite
      if: steps.oss-cad-suite-cache.outputs.cache-hit != 'true'
      uses: YosysHQ/setup-oss-cad-suite@v3
      with:
        version: ${{ env.OSS_CAD_SUITE_VERSION }}
        # Authenticate the releases API request to avoid public rate limits.
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Add cached OSS CAD Suite to PATH
      if: steps.oss-cad-suite-cache.outputs.cache-hit == 'true'
      run: echo "$RUNNER_TEMP/oss-cad-suite/bin" >> "$GITHUB_PATH"
    - name: Run formal verification
      run: ./formal
    - name: Upload formal results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: formal-results
        path: build/formal/

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    # Install the Python deps before OSS CAD Suite goes on the PATH, so
    # pipenv builds its venv from setup-python's interpreter, not the suite's.
    - name: Install pipenv
      run: |
        pip install pipenv
        # --dev for Ruff, Pyright, and Copra (DUT type stubs), which synth uses.
        pipenv install --deploy --dev
    # Keep this version in sync with the OSS CAD Suite release used locally.
    # setup-oss-cad-suite always queries the GitHub releases API and downloads
    # the suite, so restore it from the cache and only run the action on a miss.
    # The action extracts to $RUNNER_TEMP/oss-cad-suite and adds its bin/ to
    # PATH, which is all a cache hit needs to redo.
    - name: Restore OSS CAD Suite
      id: oss-cad-suite-cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/oss-cad-suite
        key: oss-cad-suite-${{ runner.os }}-${{ runner.arch }}-${{ env.OSS_CAD_SUITE_VERSION }}
    - name: Install OSS CAD Suite
      if: steps.oss-cad-suite-cache.outputs.cache-hit != 'true'
      uses: YosysHQ/setup-oss-cad-suite@v3
      with:
        version: ${{ env.OSS_CAD_SUITE_VERSION }}
        # Authenticate the releases API request to avoid public rate limits.
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Add cached OSS CAD Suite to PATH
      if: steps.oss-cad-suite-cache.outputs.cache-hit == 'true'
      run: echo "$RUNNER_TEMP/oss-cad-suite/bin" >> "$GITHUB_PATH"
    - name: Run FPGA synthesis
      env:
        # The suite sets VIRTUAL_ENV to itself; make pipenv use its own venv.
        PIPENV_IGNORE_VIRTUALENVS: "1"
      run: pipenv run "`pwd`/synth"
    - name: Publish Test Report
      uses: ctrf-io/github-test-reporter@v1
      with:
        report-path: './build/results.json'
        suite-folded-report: true
        group-by: "suite"
      if: always()
    - name: Upload bitstream
      uses: actions/upload-artifact@v4
      with:
        name: ulx3s-85k-bitstream
        path: |
          ./build/toplevel.ulx3s.bit
          ./build/toplevel.ulx3s.json
